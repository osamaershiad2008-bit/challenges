<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الاختبارات | أسامة ⚔️ عمار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .task-checkbox {
            appearance: none;
            background-color: rgba(255, 255, 255, 0.1);
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #3b82f6;
            border-radius: 0.3em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: 0.2s all ease-in-out;
        }
        .task-checkbox::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: transform-origin;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .task-checkbox:checked { background-color: #3b82f6; }
        .task-checkbox:checked::before { transform: scale(1); }

        .line-through-custom {
            text-decoration: line-through;
            color: #94a3b8;
            transition: 0.3s all ease;
        }

        .tab-active { border-bottom: 4px solid #3b82f6; color: #60a5fa; }
        .tab-inactive { border-bottom: 4px solid transparent; color: #94a3b8; }
        .tab-inactive:hover { color: #cbd5e1; }
        
        .crown-icon { color: #fbbf24; filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.6)); }

        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-20">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0f172a] px-4">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-md text-center">
            <h1 class="text-3xl font-bold mb-2 text-blue-400">تحدي الـ 16 يوم ⚔️</h1>
            <p class="text-gray-400 mb-8">اختر هويتك لتبدأ المنافسة</p>
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="loginAs('osama')" class="bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-xl font-bold transition flex flex-col items-center gap-2 shadow-lg">
                    <i class="fa-solid fa-user-ninja text-3xl"></i>
                    <span>أنا أسامة</span>
                </button>
                <button onclick="loginAs('ammar')" class="bg-purple-600 hover:bg-purple-500 text-white p-4 rounded-xl font-bold transition flex flex-col items-center gap-2 shadow-lg">
                    <i class="fa-solid fa-user-astronaut text-3xl"></i>
                    <span>أنا عمار</span>
                </button>
            </div>
        </div>
    </div>

    <!-- شاشة التحميل -->
    <div id="loading-screen" class="fixed inset-0 z-[60] hidden items-center justify-center bg-[#0f172a]/90 backdrop-blur-sm">
        <div class="flex flex-col items-center gap-4">
            <div class="loader"></div>
            <p class="text-blue-400 font-bold animate-pulse">جاري الاتصال بقاعدة البيانات...</p>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div id="main-app" class="hidden max-w-4xl mx-auto px-4 pt-6">
        
        <!-- الهيدر ولوحة الشرف -->
        <header class="glass-panel rounded-3xl p-6 mb-8 mt-4 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>
            
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <!-- العداد -->
                <div class="text-center bg-white/5 py-3 px-6 rounded-2xl border border-white/10">
                    <p class="text-sm text-gray-400 mb-1">باقي على الاختبارات</p>
                    <div class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-400">
                        16 يوم
                    </div>
                </div>

                <!-- المواجهة -->
                <div class="flex-1 w-full max-w-md">
                    <h2 class="text-center font-bold text-xl mb-4 text-gray-200">لوحة الشرف 🏆</h2>
                    
                    <!-- أسامة -->
                    <div class="mb-3">
                        <div class="flex justify-between text-sm mb-1">
                            <span class="font-bold flex items-center gap-2">
                                أسامة <i id="osama-crown" class="fa-solid fa-crown crown-icon hidden text-lg"></i>
                            </span>
                            <span id="osama-score" class="font-bold text-blue-400">0 مهام</span>
                        </div>
                        <div class="h-3 w-full bg-gray-700 rounded-full overflow-hidden">
                            <div id="osama-progress" class="h-full bg-blue-500 transition-all duration-1000 w-0"></div>
                        </div>
                    </div>

                    <!-- عمار -->
                    <div>
                        <div class="flex justify-between text-sm mb-1">
                            <span class="font-bold flex items-center gap-2">
                                عمار <i id="ammar-crown" class="fa-solid fa-crown crown-icon hidden text-lg"></i>
                            </span>
                            <span id="ammar-score" class="font-bold text-purple-400">0 مهام</span>
                        </div>
                        <div class="h-3 w-full bg-gray-700 rounded-full overflow-hidden">
                            <div id="ammar-progress" class="h-full bg-purple-500 transition-all duration-1000 w-0"></div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- التبويبات -->
        <div class="flex border-b border-gray-700 mb-6">
            <button onclick="switchTab('osama')" id="tab-osama" class="flex-1 py-4 text-center font-bold text-lg tab-active transition">
                <i class="fa-solid fa-user-ninja mr-2"></i> جدول أسامة
            </button>
            <button onclick="switchTab('ammar')" id="tab-ammar" class="flex-1 py-4 text-center font-bold text-lg tab-inactive transition">
                <i class="fa-solid fa-user-astronaut mr-2"></i> جدول عمار
            </button>
        </div>

        <!-- منطقة الأيام والمهام -->
        <div id="days-container" class="space-y-4">
            <!-- سيتم توليد الأيام هنا عبر الجافاسكربت -->
        </div>

    </div>

    <!-- إشعارات Toast -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 flex flex-col gap-2 z-50 pointer-events-none"></div>

    <!-- استيراد Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // إعدادات قاعدة البيانات الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyCoGH7xgKWIyG639uct4rhAcNO7YCu9oag",
            authDomain: "studychallenge-e6fc3.firebaseapp.com",
            projectId: "studychallenge-e6fc3",
            storageBucket: "studychallenge-e6fc3.firebasestorage.app",
            messagingSenderId: "159628995917",
            appId: "1:159628995917:web:f668bcd1375dbe6f5c5b04",
            measurementId: "G-WPGZH4PG0E"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase init error:", e);
            alert("حدث خطأ في تهيئة قاعدة البيانات.");
        }

        // حالة التطبيق
        window.currentUser = null;
        window.currentTab = 'osama';
        window.allTasks = []; 
        const TOTAL_DAYS = 16;
        const COLLECTION_NAME = "challenge_tasks";

        // دوال مساعدة لـ UI
        const showLoading = () => document.getElementById('loading-screen').classList.replace('hidden', 'flex');
        const hideLoading = () => document.getElementById('loading-screen').classList.replace('flex', 'hidden');

        // تسجيل الدخول
        window.loginAs = async function(userType) {
            window.currentUser = userType;
            document.getElementById('login-screen').classList.add('hidden');
            showLoading();

            try {
                // تسجيل الدخول كمجهول للوصول لقاعدة البيانات الخاصة بك
                await signInAnonymously(auth);
                
                // بدء جلب المهام
                startListeningToTasks();
                
                document.getElementById('main-app').classList.remove('hidden');
                switchTab(userType); 
                showToast(`مرحباً بك يا ${userType === 'osama' ? 'أسامة' : 'عمار'}! ⚔️`);
                hideLoading();
            } catch (error) {
                console.error("Auth error:", error);
                hideLoading();
                document.getElementById('login-screen').classList.remove('hidden');
                
                if (error.code === 'auth/configuration-not-found') {
                    alert("⚠️ عذراً! لم تقم بتفعيل 'تسجيل الدخول' (Authentication) في مشروعك على Firebase.\n\nيرجى الذهاب إلى موقع Firebase ثم Authentication -> Get Started -> وتفعيل 'Anonymous' لحل المشكلة.");
                } else {
                    alert("فشل الاتصال! يرجى التأكد من إعدادات منصة Firebase.");
                }
            }
        };

        // جلب البيانات لحظياً
        function startListeningToTasks() {
            const tasksRef = collection(db, COLLECTION_NAME);
            const q = query(tasksRef, orderBy("createdAt", "asc"));

            onSnapshot(q, (snapshot) => {
                window.allTasks = [];
                snapshot.forEach((doc) => {
                    window.allTasks.push({ id: doc.id, ...doc.data() });
                });
                renderApp();
                updateLeaderboard();
            }, (error) => {
                console.error("Firestore error:", error);
                if (error.code === 'permission-denied') {
                    alert("ممنوع الوصول للقاعدة! تأكد من تفعيل Firestore واختيار Start in Test Mode في حسابك.");
                }
            });
        }

        // تبديل التبويبات
        window.switchTab = function(tabName) {
            window.currentTab = tabName;
            
            document.getElementById('tab-osama').className = tabName === 'osama' ? 'flex-1 py-4 text-center font-bold text-lg tab-active transition' : 'flex-1 py-4 text-center font-bold text-lg tab-inactive transition';
            document.getElementById('tab-ammar').className = tabName === 'ammar' ? 'flex-1 py-4 text-center font-bold text-lg tab-active transition' : 'flex-1 py-4 text-center font-bold text-lg tab-inactive transition';
            
            renderApp();
        };

        // رسم واجهة الأيام والمهام
        function renderApp() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';

            const isMyTab = window.currentUser === window.currentTab;

            for (let day = 1; day <= TOTAL_DAYS; day++) {
                const dayTasks = window.allTasks.filter(t => t.day === day && t.owner === window.currentTab);
                const completedCount = dayTasks.filter(t => t.completed).length;
                const totalCount = dayTasks.length;
                
                const isDayDone = totalCount > 0 && completedCount === totalCount;
                const dayBg = isDayDone ? 'bg-green-900/20 border-green-500/30' : 'glass-panel';
                const dayHeaderColor = isDayDone ? 'text-green-400' : 'text-blue-300';

                let html = `
                    <div class="${dayBg} rounded-2xl p-5 transition-all duration-300">
                        <div class="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
                            <h3 class="font-bold text-lg ${dayHeaderColor}">اليوم ${day}</h3>
                            <span class="text-sm bg-black/30 px-3 py-1 rounded-full text-gray-300">
                                ${completedCount}/${totalCount} مهام
                            </span>
                        </div>
                        
                        <div class="space-y-3 mb-4">
                `;

                if (dayTasks.length === 0) {
                    html += `<p class="text-gray-500 text-center text-sm italic">لا توجد مهام مضافة بعد.</p>`;
                } else {
                    dayTasks.forEach(task => {
                        const textClass = task.completed ? 'line-through-custom' : 'text-gray-100';
                        
                        html += `
                            <div class="flex items-center gap-3 bg-white/5 p-3 rounded-xl border border-white/5 hover:border-white/10 transition group">
                                <input type="checkbox" 
                                    class="task-checkbox flex-shrink-0" 
                                    ${task.completed ? 'checked' : ''} 
                                    ${!isMyTab ? 'disabled' : `onchange="toggleTask('${task.id}', this.checked)"`}
                                >
                                <span class="flex-1 ${textClass}">${task.text}</span>
                        `;

                        if (isMyTab) {
                            html += `
                                <button onclick="deleteTask('${task.id}')" class="text-red-400 opacity-0 group-hover:opacity-100 transition hover:text-red-300">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            `;
                        }

                        html += `</div>`;
                    });
                }

                html += `</div>`;

                if (isMyTab) {
                    html += `
                        <div class="flex gap-2 mt-4 pt-4 border-t border-white/5">
                            <input type="text" id="input-day-${day}" placeholder="اكتب مهمة جديدة هنا..." 
                                class="flex-1 bg-black/20 border border-white/10 rounded-xl px-4 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
                                onkeypress="if(event.key === 'Enter') addTask(${day})"
                            >
                            <button onclick="addTask(${day})" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl transition font-bold shadow-lg shadow-blue-500/20">
                                <i class="fa-solid fa-plus"></i> إضافة
                            </button>
                        </div>
                    `;
                }

                html += `</div>`;
                container.innerHTML += html;
            }
        }

        // إضافة مهمة
        window.addTask = async function(day) {
            const input = document.getElementById(`input-day-${day}`);
            const text = input.value.trim();
            if (!text) return;

            const taskId = doc(collection(db, COLLECTION_NAME)).id;
            input.value = ''; 

            try {
                await setDoc(doc(db, COLLECTION_NAME, taskId), {
                    day: day,
                    text: text,
                    completed: false,
                    owner: window.currentUser,
                    createdAt: Date.now()
                });
                showToast("تمت الإضافة بنجاح");
            } catch (e) {
                console.error("Error adding task:", e);
                alert("حدث خطأ أثناء حفظ المهمة!");
            }
        };

        // تحديث حالة المهمة
        window.toggleTask = async function(taskId, isCompleted) {
            try {
                await setDoc(doc(db, COLLECTION_NAME, taskId), {
                    completed: isCompleted
                }, { merge: true }); 
                
                if(isCompleted) showToast("عاش بطل! استمر 🔥");
            } catch (e) {
                console.error("Error toggling task:", e);
            }
        };

        // حذف مهمة
        window.deleteTask = async function(taskId) {
            if(confirm("متأكد من حذف هذه المهمة؟")) {
                try {
                    await deleteDoc(doc(db, COLLECTION_NAME, taskId));
                    showToast("تم الحذف");
                } catch (e) {
                    console.error("Error deleting task:", e);
                }
            }
        };

        // تحديث النقاط ولوحة الشرف
        function updateLeaderboard() {
            let osamaCompleted = 0, ammarCompleted = 0;
            let osamaTotal = 0, ammarTotal = 0;

            window.allTasks.forEach(task => {
                if (task.owner === 'osama') {
                    osamaTotal++;
                    if (task.completed) osamaCompleted++;
                } else if (task.owner === 'ammar') {
                    ammarTotal++;
                    if (task.completed) ammarCompleted++;
                }
            });

            const osamaPct = osamaTotal > 0 ? Math.round((osamaCompleted / osamaTotal) * 100) : 0;
            const ammarPct = ammarTotal > 0 ? Math.round((ammarCompleted / ammarTotal) * 100) : 0;

            document.getElementById('osama-score').innerText = `${osamaCompleted} من ${osamaTotal}`;
            document.getElementById('ammar-score').innerText = `${ammarCompleted} من ${ammarTotal}`;
            
            document.getElementById('osama-progress').style.width = `${osamaPct}%`;
            document.getElementById('ammar-progress').style.width = `${ammarPct}%`;

            document.getElementById('osama-crown').classList.add('hidden');
            document.getElementById('ammar-crown').classList.add('hidden');

            if (osamaCompleted > ammarCompleted && osamaCompleted > 0) {
                document.getElementById('osama-crown').classList.remove('hidden');
            } else if (ammarCompleted > osamaCompleted && ammarCompleted > 0) {
                document.getElementById('ammar-crown').classList.remove('hidden');
            }
        }

        // إشعارات منبثقة
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass-panel text-white px-6 py-3 rounded-full font-bold shadow-2xl transition-all duration-300 transform translate-y-10 opacity-0';
            toast.innerText = message;
            
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-10');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

    </script>
</body>
</html>
